name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Fetch core (libbox.aar)
        run: bash scripts/fetch-core.sh

      # APK rilis ditandatangani kunci rilis (rahasia repo), bukan kunci debug.
      # Kalau secret belum ada, langkah ini gagal - sengaja, supaya tidak pernah
      # ada rilis yang diam-diam ditandatangani kunci debug.
      - name: Prepare release keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::KEYSTORE_BASE64 belum diisi - rilis ditolak"
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build Release APKs
        run: ./gradlew :app:assembleRelease

      # Dua penjaga, keduanya wajib:
      #  1. tolak kunci debug (kunci debug publik, APK-nya tidak bisa di-update
      #     setelah pindah ke kunci rilis),
      #  2. pastikan fingerprint sertifikat PERSIS sama dengan yang dipin di bwh.
      #     Tanpa pin ini, build yang tidak sengaja memakai keystore lain tetap
      #     lolos dan pembeli tidak bisa update di atas versi sebelumnya.
      - name: Verify APK signature
        env:
          EXPECTED_CERT_SHA256: d634a65603dbdce87115e9cca5f4afd557ca441f15d87fcef1bd34edbbbf8cd6
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/release
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          for apk in *.apk; do
            echo "--- $apk"
            CERTS=$("$APKSIGNER" verify --print-certs "$apk")
            echo "$CERTS" | sed -n '1,3p'
            if echo "$CERTS" | grep -qi "Android Debug"; then
              echo "::error::$apk is signed with the debug key"
              exit 1
            fi
            ACTUAL=$(echo "$CERTS" | grep -i "SHA-256 digest" | head -1 \
                     | sed 's/.*digest: *//' | tr -d ' \r' | tr 'A-Z' 'a-z')
            if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::$apk signature mismatch"
              echo "  expected: $EXPECTED_CERT_SHA256"
              echo "  actual  : $ACTUAL"
              exit 1
            fi
            echo "OK: sertifikat cocok dengan yang dipin"
          done

      - name: Rename APKs
        run: |
          cd app/build/outputs/apk/release
          VERSION=$(grep 'versionName' ../../../../build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          mv app-arm64-v8a-release.apk "PanSocks-${VERSION}-arm64-v8a.apk"
          mv app-armeabi-v7a-release.apk "PanSocks-${VERSION}-armeabi-v7a.apk"
          mv app-universal-release.apk "PanSocks-${VERSION}-universal.apk"
          ls -lh *.apk

          # Ukuran dihitung dari file hasil build, bukan ditulis tangan di
          # catatan rilis - angka manual pasti basi begitu APK mengecil/membesar.
          mb() { awk -v b="$1" 'BEGIN{printf "%.1f", b/1048576}'; }
          {
            echo "SIZE_V8=$(mb $(stat -c%s "PanSocks-${VERSION}-arm64-v8a.apk"))"
            echo "SIZE_V7=$(mb $(stat -c%s "PanSocks-${VERSION}-armeabi-v7a.apk"))"
            echo "SIZE_UNIV=$(mb $(stat -c%s "PanSocks-${VERSION}-universal.apk"))"
          } >> $GITHUB_ENV

      - name: Write SHA256SUMS
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PanSocks-APKs
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt

      # Re-run harus idempotent: kalau rilis untuk tag ini sudah ada, hapus dulu
      # supaya upload aset tidak bentrok.
      - name: Reset current release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          name: "PanSocks ${{ env.VERSION }} — Android"
          # CATATAN: bagian "Yang baru" ditulis untuk versi ini dan harus
          # diperbarui setiap kali menaikkan versi. Bagian "Pilih file" sudah
          # otomatis (ukuran dihitung dari APK hasil build).
          body: |
            ## PanSocks ${{ env.VERSION }} — Android

            **Yang baru**

            - Ukuran APK turun **88%**: 51,5 MB -> 5,9 MB. Tiga penyebabnya:
              `libbox.so` tidak dikompres di APK, build tag `badlinkname` yang
              membuat tabel relokasi membengkak ~8x, dan core sing-box v1.14
              yang jauh lebih besar.
            - Core dipaku ke **sing-box v1.11.15** (sama seperti PanTunnel).
            - **Preflight**: TCP + handshake SOCKS5 diperiksa dulu. Server mati
              atau password salah ketahuan dalam detik, dan tunnel tidak pernah naik.
            - **Counter traffic diperbaiki**. Statistik interface tidak bisa dibaca
              app (dilindungi SELinux), jadi sekarang dihitung per-uid lewat
              `TrafficStats`. Dihitung per sesi: mulai 0 saat connect, dihapus
              saat disconnect.
            - **UI tidak lagi macet** di "Menyiapkan VPN..." dengan tombol yang
              tidak bisa ditekan.
            - Menu titik tiga: toggle **HTTP ping** dan **Counter** (centang = hidup).
            - Header dihapus, status dan counter menempel di bawah tombol Connect.

            ### Pilih file

            | File | Untuk siapa | Ukuran |
            |---|---|---|
            | **`PanSocks-${{ env.VERSION }}-arm64-v8a.apk`** | **Rekomendasi** — HP 2016+, arm64-v8a | ${{ env.SIZE_V8 }} MB |
            | `PanSocks-${{ env.VERSION }}-armeabi-v7a.apk` | HP lama, armeabi-v7a 32-bit | ${{ env.SIZE_V7 }} MB |
            | `PanSocks-${{ env.VERSION }}-universal.apk` | Semua HP (kalau ragu) | ${{ env.SIZE_UNIV }} MB |

            ### Cara pakai

            1. Unduh APK sesuai arsitektur HP.
            2. Buka, izinkan instalasi dari sumber ini bila Android bertanya.
            3. Isi **Host** (IP server) dan **Port**, lalu tekan **Connect**.
            4. Setujui permintaan VPN.

            Host wajib **IP literal** (contoh `10.12.132.225`), bukan hostname —
            hostname akan di-resolve di luar tunnel dan bocor DNS.

            ### Update dari versi sebelumnya

            Bisa langsung install di atas versi sebelumnya — sertifikat sama, setelan tidak hilang.

            ### Verifikasi

            ```
            SHA-256 sertifikat: d634a65603dbdce87115e9cca5f4afd557ca441f15d87fcef1bd34edbbbf8cd6
            ```

            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            Cek sendiri sertifikatnya:

            ```bash
            apksigner verify --print-certs PanSocks-${{ env.VERSION }}-arm64-v8a.apk
            ```
          draft: false
          prerelease: false
          # Eksplisit: rilis APK harus jadi "Latest". Rilis "core" ditandai
          # --latest=false di workflow-nya, jadi tidak pernah saling rebutan.
          make_latest: true

      # Kebijakan rilis: hanya rilis APK terbaru yang dipertahankan supaya
      # halaman Releases tetap bersih. Tag git-nya tidak dihapus.
      #
      # Dijalankan SETELAH rilis baru berhasil dibuat. Sebelumnya step ini ada
      # di depan: kalau pembuatan rilis gagal, semua rilis lama sudah terhapus
      # lebih dulu dan tinggal menyisakan nol rilis.
      # `|| true` pada grep penting - kalau tidak ada rilis lama, grep keluar 1
      # dan `-o pipefail` menggagalkan step ini.
      - name: Delete superseded releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "::error::rilis ${{ github.ref_name }} tidak ada - pembuatan gagal, rilis lama tidak disentuh"
            exit 1
          fi
          old=$(gh release list --limit 100 --json tagName --jq '.[].tagName' \
                  | grep -E '^v[0-9]' | grep -v "^${{ github.ref_name }}$" || true)
          for tag in $old; do
            echo "menghapus rilis lama: $tag"
            gh release delete "$tag" --yes || true
          done
